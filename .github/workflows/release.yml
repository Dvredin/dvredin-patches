name: Release

on:
  workflow_dispatch:
    inputs:
      owner_verified:
        description: 'Stable only: the maintainer accepted this exact source/candidate'
        required: true
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref_name == 'dev' || (github.ref_name == 'main' && inputs.owner_verified)
    permissions:
      contents: write
      packages: read
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify repository
        run: |
          python3 scripts/verify_repository.py
          python3 -m unittest discover -s tests -v
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Extension behavior regressions
        run: ./gradlew -p tests test --no-daemon
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify pinned release dependency source and depth guards
        run: node --test tests/test_release_dependencies.cjs
      - run: pnpm audit --audit-level=high
      # Maintained Semantic Release engine and the original Morphe configuration.
      # The npm-installing wrapper is intentionally not used: it restores unused dependencies.
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
      - name: Attest published bundle
        if: steps.release.outputs.published == 'true'
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: 'Dvredin Patches ${{ steps.release.outputs.tag }}'
          subject-path: patches/build/libs/patches-*.mpp
      - name: Verify compilation when no release is generated
        if: steps.release.outputs.published != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon
