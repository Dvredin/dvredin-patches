name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Repository and maintenance regressions
        run: |
          python3 scripts/verify_repository.py
          python3 -m unittest discover -s tests -v
          git diff --check
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Extension behavior regressions
        run: ./gradlew -p tests test --no-daemon
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.8.1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify pinned release dependency source and depth guards
        run: node --test tests/test_release_dependencies.cjs
      - run: pnpm audit --audit-level=high
      - name: Compile actual patch and extension sources
        id: build
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon
      - name: Retain compiled test candidate
        if: ${{ steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: patch-candidate-${{ github.sha }}
          path: patches/build/libs/*.mpp
          if-no-files-found: error
          retention-days: 7
